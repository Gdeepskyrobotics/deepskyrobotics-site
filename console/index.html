<!-- ════════════════════════════════════════════════════════════════════════
     SIMULATION SHIM — public marketing demo.
     This console is a self-contained DEMONSTRATION driven entirely by
     SIMULATED data. There is no backend. This shim intercepts every data
     call the UI makes and answers with synthetic, generic values, so nothing
     real is ever fetched, forwarded, or displayed. All writes are refused.
     ════════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  "use strict";
  var realFetch = window.fetch ? window.fetch.bind(window) : null;

  // ── synthetic live-hardware sensors (generic tags, no real plant data) ──
  var LIVE = [
    { id:"hw-01", name:"LINE-A-MOTOR-01", label:"Vibration",  unit:"mm/s",  v:4.2, min:2,   max:9,   dec:1, warnHi:6.0,  critHi:7.5 },
    { id:"hw-02", name:"LINE-A-SPINDLE",  label:"Temp",       unit:"°C", v:62, min:40, max:100, dec:1, warnHi:80,  critHi:90 },
    { id:"hw-03", name:"LINE-B-PUMP-02",  label:"Pressure",   unit:"PSI",   v:180, min:120, max:280, dec:0, warnHi:240, critHi:265 },
    { id:"hw-04", name:"CONVEYOR-03",     label:"Belt speed", unit:"m/s",   v:1.8, min:0.5, max:3,   dec:2, warnLo:1.0, critLo:0.7 },
    { id:"hw-05", name:"COMPRESSOR-01",   label:"Current",    unit:"A",     v:34,  min:10,  max:60,  dec:1, warnHi:48,  critHi:55 },
    { id:"hw-06", name:"CHILLER-02",      label:"Flow",       unit:"L/min", v:120, min:60,  max:200, dec:0, warnLo:80,  critLo:60 }
  ];
  var HIST = {};
  LIVE.forEach(function (s) {
    var arr = [], x = s.v;
    for (var i = 0; i < 30; i++) { x += (Math.random() - 0.5) * (s.max - s.min) * 0.03; arr.push(round(x, s.dec)); }
    HIST[s.id] = arr;
  });
  function round(x, d) { var p = Math.pow(10, d || 0); return Math.round(x * p) / p; }
  function step() {
    return LIVE.map(function (s) {
      var arr = HIST[s.id];
      var last = arr[arr.length - 1];
      var span = (s.max - s.min);
      var nv = last + (Math.random() - 0.5) * span * 0.05;      // random walk
      nv += (s.v - last) * 0.03;                                // gentle mean-revert
      nv = Math.max(s.min, Math.min(s.max, round(nv, s.dec)));
      arr.push(nv); if (arr.length > 30) arr.shift();
      var o = { id:s.id, name:s.name, label:s.label, unit:s.unit, value:nv,
                series:arr.slice(), min:s.min, max:s.max, dec:s.dec, stale:false };
      if (s.warnHi != null) o.warnHi = s.warnHi;
      if (s.critHi != null) o.critHi = s.critHi;
      if (s.warnLo != null) o.warnLo = s.warnLo;
      if (s.critLo != null) o.critLo = s.critLo;
      return o;
    });
  }

  // ── synthetic equipment profiles + assets (read-only browsing demo) ──
  var PROFILES = [
    { profile_id:"p-1001", manufacturer:"Fieldline Instruments", model:"VX-220", device_type:"vibration sensor",
      protocol:"Modbus RTU", output_type:"4-20 mA", measured_unit:"mm/s", measured_min:0, measured_max:50,
      supply_voltage_unit:"V", supply_voltage_min:18, supply_voltage_max:30, confidence:0.86,
      tags:["vibration","predictive"], failure_signals:["Rising RMS above the warn band indicates bearing wear"],
      maintenance_notes:["Re-torque mounts each quarter"], wiring_notes:["Shielded twisted pair, single-point ground"],
      evidence:["datasheet §4.2"], links:[{ asset_id:"hw-01", tag:"vib_rms" }] },
    { profile_id:"p-1002", manufacturer:"Thermetric", model:"RT-90", device_type:"RTD temperature probe",
      protocol:"OPC UA", output_type:"digital", measured_unit:"°C", measured_min:-40, measured_max:200,
      supply_voltage_unit:"V", supply_voltage_min:12, supply_voltage_max:24, confidence:0.91,
      tags:["temperature"], failure_signals:["Drift beyond calibration span"], maintenance_notes:["Annual calibration"],
      wiring_notes:["3-wire RTD"], evidence:["datasheet §2.1"], links:[{ asset_id:"hw-02", tag:"temp_c" }] },
    { profile_id:"p-1003", manufacturer:"Aeroflux", model:"PT-8", device_type:"pressure transmitter",
      protocol:"HART", output_type:"4-20 mA", measured_unit:"PSI", measured_min:0, measured_max:400,
      supply_voltage_unit:"V", supply_voltage_min:12, supply_voltage_max:36, confidence:0.79,
      tags:["pressure","hydraulic"], failure_signals:["Zero-offset creep"], maintenance_notes:["Verify zero at shutdown"],
      wiring_notes:["Loop-powered"], evidence:["datasheet §3"], links:[{ asset_id:"hw-03", tag:"press_psi" }] }
  ];
  var ASSETS = LIVE.map(function (s) {
    return { asset_id:s.id, label:s.name.replace(/-/g, " "), location:"Demo line", asset_type:s.label.toLowerCase() };
  });

  // ── canned docs (fixed content; the ?path= parameter is ignored — no reader) ──
  var DOC_LIST = [
    { title:"Welcome to the demo", path:"welcome" },
    { title:"What you're looking at", path:"about" }
  ];
  var DOC_BODY =
    "# NEPHES Factory Observer — live demo\n\n" +
    "Everything on this console is **simulated**. The sensor wall, trends, alarms, " +
    "and recommendations are generated in your browser from synthetic data — there " +
    "is no factory and no backend behind this page.\n\n" +
    "In a real deployment, NFO reads the PLCs and sensors you already run, on your " +
    "own hardware, and reasons over every signal in real time.\n\n" +
    "Book a demo to see it on your own line.";

  function json(obj, status) {
    return Promise.resolve(new Response(JSON.stringify(obj),
      { status: status || 200, headers: { "Content-Type": "application/json" } }));
  }
  function text(body) {
    return Promise.resolve(new Response(body,
      { status: 200, headers: { "Content-Type": "text/markdown" } }));
  }

  window.fetch = function (input, init) {
    var url = "";
    try { url = (typeof input === "string") ? input : (input && input.url) || ""; } catch (e) { url = ""; }
    var method = ((init && init.method) || (input && input.method) || "GET").toUpperCase();
    var path = url;
    try { path = new URL(url, window.location.href).pathname; } catch (e) {}

    // live hardware feed
    if (path.indexOf("/factory-observer/live") !== -1 || path.indexOf("/api/live") !== -1) {
      return json({ live: true, sensors: step() });
    }
    // docs list
    if (/\/docs\/raw$/.test(path) || path.indexOf("/docs/raw") !== -1) { return text(DOC_BODY); }
    if (/\/docs$/.test(path)) { return json(DOC_LIST); }
    // equipment browsing (read-only, synthetic)
    if (path.indexOf("/equipment/profiles") !== -1) {
      if (method !== "GET") { return json({ error: "read-only demo" }, 405); }
      return json({ profiles: PROFILES });
    }
    if (/\/assets$/.test(path)) { return json({ assets: ASSETS }); }
    // any write / ingest / link is refused — this is a read-only public demo
    if (path.indexOf("/equipment/ingest") !== -1 || path.indexOf("/link") !== -1) {
      return json({ error: "read-only demo" }, 405);
    }
    // DENY BY DEFAULT: the only thing allowed to touch the real network is a
    // same-origin static asset this bundle ships (vendored libs, fonts, images,
    // jsx). Everything else — any API path, any absolute/cross-origin URL — is
    // answered in-page with an empty response and never leaves the browser.
    var sameOrigin = false, isAsset = false;
    try {
      var u = new URL(url, window.location.href);
      sameOrigin = (u.origin === window.location.origin);
      isAsset = /\.(js|mjs|css|map|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|jsx|json)$/i.test(u.pathname);
    } catch (e) {}
    if (realFetch && sameOrigin && isAsset) return realFetch(input, init);
    return json({}, 204);
  };
})();
</script>

.scan-prompt { font-size:11px; color:var(--text-2); line-height:1.6; margin-bottom:16px; }
.scan-btn { cursor:pointer; background:rgba(var(--accent-rgb),.1); color:var(--accent); border:1px solid rgba(var(--accent-rgb),.35); border-radius:var(--r-sm); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:10px 22px; font-family:inherit; transition:background .15s; }
.scan-btn:hover { background:rgba(var(--accent-rgb),.2); }
.scan-range { font-family:var(--mono); font-size:9px; color:var(--text-4); margin-top:12px; }
.scan-running { margin:auto; text-align:center; }
.scan-radar { position:relative; width:54px; height:54px; margin:0 auto 16px; }
.scan-radar span { position:absolute; inset:0; border:2px solid var(--accent); border-radius:50%; opacity:0; animation:radar 1.8s ease-out infinite; }
.scan-radar span:nth-child(2) { animation-delay:.6s; } .scan-radar span:nth-child(3) { animation-delay:1.2s; }
@keyframes radar { 0%{transform:scale(.3);opacity:.9} 100%{transform:scale(1);opacity:0} }
.scan-msg { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); }
.scan-sub { font-size:10px; color:var(--text-3); margin-top:4px; }
.scan-results { display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; }
.scan-found-head { display:flex; align-items:center; justify-content:space-between; font-size:10px; font-weight:700; color:var(--text-2); }
.scan-rescan { cursor:pointer; background:none; border:1px solid var(--card-border); border-radius:var(--r-sm); color:var(--text-3); font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; font-family:inherit; }
.scan-rescan:hover { color:var(--accent); border-color:var(--accent); }
.scan-list { display:flex; flex-direction:column; gap:5px; max-height:240px; overflow-y:auto; }
.scan-item { display:flex; align-items:center; gap:10px; padding:8px 11px; background:var(--card-bg2); border:1px solid var(--card-border); border-radius:var(--r-sm); cursor:pointer; transition:border-color .12s, background .12s; }
.scan-item.on { border-color:rgba(var(--accent-rgb),.45); background:rgba(var(--accent-rgb),.05); }
.scan-item input { display:none; }
.si-check { width:16px; height:16px; border-radius:4px; border:1px solid var(--card-border2); display:flex; align-items:center; justify-content:center; font-size:10px; color:transparent; flex-shrink:0; }
.scan-item.on .si-check { background:var(--accent); border-color:var(--accent); color:#1a1505; }
.si-main { display:flex; flex-direction:column; min-width:0; flex:1; }
.si-name { font-family:var(--mono); font-size:11px; font-weight:700; color:var(--text-1); }
.si-meta { font-size:9px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.si-mac { font-family:var(--mono); font-size:8px; color:var(--text-4); flex-shrink:0; }
.settings-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.settings-label { font-size:11px; color:var(--text-2); }
.settings-toggle { width:34px; height:18px; border-radius:9999px; border:1px solid var(--card-border); background:var(--card-bg2); cursor:pointer; padding:0; position:relative; transition:background .18s, border-color .18s; flex-shrink:0; }
.settings-toggle .settings-toggle-knob { position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%; background:var(--text-3); transition:transform .18s, background .18s; }
.settings-toggle.on { background:rgba(var(--accent-rgb),.22); border-color:var(--accent); }
.settings-toggle.on .settings-toggle-knob { transform:translateX(16px); background:var(--accent); }

/* blue light filter — warm overlay that cuts blue */
.blue-filter { position:fixed; inset:0; z-index:9998; pointer-events:none; background:#ff9a2e; mix-blend-mode:multiply; opacity:.16; }

/* ── KPI strip ── */
.kpis { flex-shrink:0; display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; padding:10px 18px 4px; }
.kpi { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:8px 12px 7px; }
.kpi .k-label { font-size:8px; font-weight:700; letter-spacing:.16em; color:var(--text-3); text-transform:uppercase; }
.kpi .k-value { font-family:var(--mono); font-size:19px; font-weight:700; line-height:1.25; color:var(--text-1); }
.kpi .k-unit { font-size:9px; color:var(--text-3); margin-left:2px; }
.kpi .k-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:4px; gap:4px; }
.k-trend { display:flex; align-items:center; font-size:8px; font-weight:800; letter-spacing:.04em; white-space:nowrap; }
.k-trend.up { color:var(--ok); } .k-trend.down { color:var(--crit); } .k-trend.flat { color:var(--text-3); }

/* ── Main grid ── */
.main { flex:1; display:grid; grid-template-columns:1fr 668px; grid-template-rows:minmax(0,1fr); gap:10px; padding:10px 18px 0; min-height:0; align-items:stretch; }
/* right region: wide AI Analysis on top, then Top Risks + Fault Sim | Action Log */
.right-region { display:flex; flex-direction:column; gap:10px; min-height:0; min-width:0; }
.right-region > #aiCard { flex:0 0 auto; max-height:38%; }
.right-lower { flex:1 1 0; min-height:0; display:flex; gap:10px; }
.right-lower .rl-col { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:10px; }
.right-lower .rl-col > .top-risks { flex:1 1 0; min-height:90px; }
.right-lower .rl-col > .fault-sim { flex:0 0 auto; }
.right-lower > .action-log { flex:1 1 0; min-width:0; }
/* combined right-side tabs — AI Analysis / Top Risks / Action Log in one card */
.right-tabs { flex:1 1 0; min-height:0; min-width:0; display:flex; flex-direction:column; }
.rt-tabbar { flex-shrink:0; display:flex; border-bottom:1px solid var(--card-border); }
.rt-tab { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 6px 9px; background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px; font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); cursor:pointer; font-family:inherit; white-space:nowrap; transition:color .15s, border-color .15s; }
.rt-tab:hover { color:var(--text-1); }
.rt-tab.on { color:var(--accent); border-bottom-color:var(--accent); }
.rt-badge { font-family:var(--mono); font-size:8px; font-weight:700; min-width:16px; text-align:center; padding:1px 5px; border-radius:8px; background:rgba(var(--accent-rgb),.15); color:var(--accent); }
.rt-badge.crit { background:rgba(248,113,113,.14); color:var(--crit); }
.rt-body { flex:1 1 0; min-height:0; display:flex; }
.rt-body > .side-card { flex:1 1 0; min-height:0; min-width:0; border:none; background:transparent; box-shadow:none; }
.rt-body > .side-card > .card-head { display:none; }

.wall-card { background:var(--card-bg2); border:1px solid var(--card-border); border-radius:var(--r-md); display:flex; flex-direction:column; min-height:0; flex:1 1 0; min-width:0; transition:flex-basis .35s cubic-bezier(.22,1,.36,1), max-width .35s cubic-bezier(.22,1,.36,1); }
/* wall + on-demand detail sit side-by-side in column 1; detail fills the freed space */
.wall-zone { display:flex; gap:10px; min-height:0; align-items:stretch; }
.card-head { flex-shrink:0; display:flex; align-items:center; gap:10px; padding:9px 13px; border-bottom:1px solid var(--card-border); font-size:9px; font-weight:800; letter-spacing:.18em; color:var(--text-2); text-transform:uppercase; }
.card-head .count-pill { font-family:var(--mono); font-size:9px; padding:1px 7px; border-radius:8px; background:rgba(var(--accent-rgb),.09); color:var(--accent); border:1px solid rgba(var(--accent-rgb),.25); letter-spacing:.04em; }
.card-head .count-pill.crit { background:rgba(248,113,113,.10); color:var(--crit); border-color:rgba(248,113,113,.28); }
.collapse-btn { margin-left:auto; border:none; background:none; cursor:pointer; color:var(--text-3); font-size:10px; padding:0 2px; line-height:1; transition:color .15s, transform .2s; }
.collapse-btn:hover { color:var(--accent); }
.side-card.collapsed > :not(.card-head) { display:none !important; }
.side-card.collapsed { flex:0 0 auto !important; }
.side-card.collapsed .collapse-btn { transform:rotate(-90deg); }

/* wall filters */
.wall-filters { display:flex; align-items:center; gap:7px; padding:6px 13px; background:var(--card-bg); border-bottom:1px solid var(--card-border); flex-wrap:wrap; flex-shrink:0; }
.wf-group { display:flex; align-items:center; gap:4px; }
.wf-label { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-right:2px; }
.wf-btn { padding:2px 8px; font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--card-border); border-radius:4px; background:transparent; color:var(--text-3); cursor:pointer; transition:color .12s,border-color .12s,background .12s; font-family:inherit; }
.wf-btn:hover { color:var(--text-1); border-color:var(--card-border2); }
.wf-btn.active { color:var(--accent); border-color:var(--accent); background:rgba(var(--accent-rgb),.07); }
.wf-btn.wf-warn.active { color:var(--warn); border-color:var(--warn); background:rgba(251,191,36,.08); }
.wf-btn.wf-crit.active { color:var(--crit); border-color:var(--crit); background:rgba(248,113,113,.08); }
.wf-sep { flex-shrink:0; width:1px; height:16px; background:var(--card-border); margin:0 2px; }
.wf-search { margin-left:auto; padding:3px 9px; font-size:10px; font-family:var(--mono); background:var(--card-bg2); border:1px solid var(--card-border); border-radius:4px; color:var(--text-1); outline:none; width:155px; transition:border-color .12s; }
.wf-search:focus { border-color:var(--accent); }
.wf-search::placeholder { color:var(--text-4); }

.wall-scroll { flex:1; overflow-y:auto; padding:10px 13px; min-height:0; }
.grp { margin-bottom:14px; }
.grp-head { display:flex; align-items:center; gap:8px; padding:4px 8px; margin-bottom:7px; border-left:2px solid var(--accent); border-radius:2px; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
.grp-head .g-name { color:var(--accent); }
.grp-head .g-sub { font-size:8px; color:var(--text-4); letter-spacing:.16em; }
.grp-head .g-count { margin-left:auto; font-family:var(--mono); font-size:8px; color:var(--text-3); }
.grp-head.warn .g-name { color:var(--warn); } .grp-head.warn { border-left-color:var(--warn); }
.grp-head.crit .g-name { color:var(--crit); } .grp-head.crit { border-left-color:var(--crit); }
.grp-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:6px; }

/* plant trends strip (lower sensor wall, tiles view) */
.trend-strip-wrap { margin-top:4px; }
.trend-strip { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:8px; }
.trend-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:9px 12px 7px; }
.trend-card .tc-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
.trend-card .tc-label { font-size:8px; font-weight:700; letter-spacing:.16em; color:var(--text-3); text-transform:uppercase; }
.trend-card .tc-value { font-family:var(--mono); font-size:17px; font-weight:700; color:var(--text-1); }
.trend-card .tc-unit { font-size:9px; color:var(--text-3); margin-left:2px; }
.trend-card .t-spark { width:100%; }

/* ── System (Backend) infrastructure view ── */
.pipeline { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; }
.pipe-stage { flex:1 1 0; min-width:120px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:11px 13px; }
.pipe-stage .ps-name { font-size:8px; font-weight:700; letter-spacing:.16em; color:var(--text-3); text-transform:uppercase; }
.pipe-stage .ps-metric { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--text-1); line-height:1.3; }
.pipe-stage .ps-metric small { font-size:9px; color:var(--text-3); margin-left:3px; font-weight:400; }
.pipe-stage .ps-sub { font-size:8px; color:var(--text-4); letter-spacing:.04em; margin-top:2px; }
.pipe-arrow { flex:0 0 26px; align-self:center; height:2px; position:relative; background:rgba(var(--accent-rgb),.18); overflow:hidden; }
.pa-flow { position:absolute; top:0; left:-40%; width:40%; height:100%; background:linear-gradient(90deg, transparent, var(--accent), transparent); animation:flowMove 1.5s linear infinite; }
@keyframes flowMove { 0%{left:-40%} 100%{left:100%} }

.node-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(186px,1fr)); gap:8px; }
.node-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:9px 11px 10px; }
.node-card--clickable { cursor:pointer; transition:border-color .15s, transform .12s, background .15s; }
.node-card--clickable:hover { border-color:rgba(var(--accent-rgb),.5); transform:translateY(-1px); }
.node-card.warn { border-color:rgba(251,191,36,.32); }
.node-card.crit { border-color:rgba(248,113,113,.30); opacity:.78; }
.nc-top { display:flex; align-items:center; gap:6px; }
.nc-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.nc-id { font-family:var(--mono); font-size:11px; font-weight:700; color:var(--text-1); }
.nc-fw { margin-left:auto; font-family:var(--mono); font-size:8px; color:var(--text-4); }
.nc-line { font-size:8px; font-weight:600; letter-spacing:.1em; color:var(--text-3); text-transform:uppercase; margin:3px 0 8px; }
.nc-offline { font-size:9px; color:var(--crit); font-weight:600; letter-spacing:.04em; padding:6px 0 2px; }
.nc-stat-row { display:flex; gap:8px; margin-bottom:7px; }
.nc-stat { flex:1; }
.ns-l { display:block; font-size:7px; font-weight:700; letter-spacing:.14em; color:var(--text-4); text-transform:uppercase; }
.ns-v { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text-1); }
.ns-v small { font-size:8px; color:var(--text-3); margin-left:2px; font-weight:400; }
.nc-cpu-row { display:flex; align-items:baseline; justify-content:space-between; }
.nc-cpu-bar { height:3px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; margin-top:3px; }
.nc-cpu-bar > div { height:100%; border-radius:2px; transition:width .5s ease, background .3s; }

/* sensor tile */
.tile { position:relative; overflow:hidden; cursor:pointer; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:8px 10px 7px; transition:border-color .18s ease, background .18s ease, transform .18s ease; text-align:left; font-family:inherit; }
.tile:hover { transform:translateY(-2px); border-color:rgba(var(--accent-rgb),.4); }
.tile.sel { border-color:var(--accent); background:rgba(var(--accent-rgb),.05); }
.tile.warn { border-color:rgba(251,191,36,.32); }
.tile.crit { border-color:rgba(248,113,113,.42); }
.tile::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; }
.tile.crit::after { box-shadow: inset 0 0 14px 1px rgba(248,113,113,.30), inset 0 0 2px 1px rgba(248,113,113,.45); animation:glowPulse 1.8s ease-in-out infinite; }
.tile.warn::after { box-shadow: inset 0 0 10px 1px rgba(251,191,36,.18), inset 0 0 2px 1px rgba(251,191,36,.30); animation:glowPulse 2.8s ease-in-out infinite; }
@keyframes glowPulse { 0%,100%{opacity:0} 50%{opacity:1} }
.t-row1 { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.t-name { font-size:8px; font-weight:700; letter-spacing:.08em; color:var(--text-3); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t-badge { font-size:7px; font-weight:800; letter-spacing:.1em; padding:1px 5px; border-radius:3px; text-transform:uppercase; background:rgba(74,222,128,.08); color:var(--ok); border:1px solid rgba(74,222,128,.22); white-space:nowrap; }
.t-badge.warn { background:rgba(251,191,36,.08); color:var(--warn); border-color:rgba(251,191,36,.22); }
.t-badge.crit { background:rgba(248,113,113,.08); color:var(--crit); border-color:rgba(248,113,113,.22); animation:badgeBlink 1.2s ease-in-out infinite; }
@keyframes badgeBlink { 0%,100%{opacity:1} 50%{opacity:.5} }
.t-asset { font-size:7px; font-weight:600; letter-spacing:.12em; color:var(--text-4); text-transform:uppercase; margin:1px 0 4px; }
.t-row2 { display:flex; align-items:flex-end; justify-content:space-between; gap:6px; }
.t-val { font-family:var(--mono); font-size:20px; font-weight:700; line-height:1; letter-spacing:-.5px; color:var(--text-1); }
.t-unit { font-size:9px; color:var(--text-3); margin-left:2px; }
.t-spark { display:block; overflow:visible; flex-shrink:0; }
.t-bar { height:2px; background:rgba(255,255,255,.06); border-radius:1px; margin:6px 0 3px; overflow:hidden; }
.t-fill { height:100%; border-radius:1px; background:var(--ok); transform-origin:left center; transition:transform .5s ease, background .3s; }
.t-row3 { display:flex; justify-content:space-between; font-size:7px; color:var(--text-4); font-family:var(--mono); }

/* heatmap grid view */
.hm-legend { display:flex; align-items:center; gap:14px; padding:2px 2px 9px; font-size:9px; color:var(--text-3); letter-spacing:.06em; }
.hm-legend .hm-count { font-family:var(--mono); color:var(--text-2); margin-right:auto; }
.hm-key { display:inline-flex; align-items:center; gap:5px; text-transform:uppercase; font-weight:700; letter-spacing:.1em; }
.hm-sw { width:9px; height:9px; border-radius:2px; display:inline-block; }
.hm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(13px,1fr)); gap:3px; padding:2px; }
.hm-grid.hm-100 { grid-template-columns:repeat(auto-fit, minmax(30px,1fr)); gap:3px; justify-content:stretch; }
.hm-cell { aspect-ratio:1/1; border-radius:2px; background:#3e6a4d; cursor:pointer; transition:transform .08s ease, box-shadow .08s ease; }
.hm-grid.hm-100 .hm-cell { border-radius:1px; }
.hm-cell.hm-warn { background:var(--warn); } .hm-cell.hm-crit { background:var(--crit); }
.hm-cell:hover { transform:scale(1.6); box-shadow:0 0 0 1px rgba(255,255,255,.5); position:relative; z-index:2; }
.hm-cell.hm-sel { box-shadow:0 0 0 2px var(--accent); position:relative; z-index:1; }

/* right column */
.side { display:flex; flex-direction:column; gap:10px; min-height:0; }
.side-card { background:var(--card-bg2); border:1px solid var(--card-border); border-radius:var(--r-md); display:flex; flex-direction:column; min-height:0; }

/* detail card */
#detailCard { flex:0 0 420px; min-width:0; min-height:0; }
/* select-a-sensor prompt (shown in the detail slot until a sensor is chosen) */
.select-prompt { flex:0 0 360px; min-width:0; align-self:stretch; display:flex; align-items:center; justify-content:center; border:1px dashed var(--card-border2); border-radius:var(--r-md); background:var(--card-bg2); }
.sp-inner { text-align:center; max-width:300px; padding:24px; }
.sp-icon { display:grid; grid-template-columns:repeat(3, 16px); gap:5px; justify-content:center; margin:0 auto 16px; }
.sp-icon span { width:16px; height:16px; border-radius:3px; background:var(--card-border2); animation:spPulse 2.6s ease-in-out infinite; }
.sp-icon span:nth-child(2n) { background:rgba(var(--accent-rgb),.35); animation-delay:.5s; }
.sp-icon span:nth-child(5) { background:var(--accent); animation-delay:.25s; }
@keyframes spPulse { 0%,100%{opacity:.35} 50%{opacity:1} }
.sp-title { font-size:14px; font-weight:800; letter-spacing:.04em; color:var(--text-1); margin-bottom:7px; }
.sp-sub { font-size:11px; color:var(--text-3); line-height:1.6; }
/* diagnosis rail (AI + Top Risks + Risk Trend) and action rail (Operator + Action Log) */
.diag-rail > #aiCard { flex:1.5 1 0; min-height:120px; }
.diag-rail > .top-risks { flex:1 1 0; min-height:120px; }
.diag-rail > .risk-trend { flex:0 0 auto; }
.act-rail > #opCard { flex:0 0 auto; }
.act-rail > .action-log { flex:1 1 0; min-height:100px; }
/* top risks watchlist */
.top-risks { min-width:0; align-self:stretch; }
.tr-sub { flex-shrink:0; padding:7px 13px 8px; font-size:9px; color:var(--text-3); letter-spacing:.04em; border-bottom:1px solid var(--card-border); }
.tr-list { flex:1; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:4px; min-height:0; }
.tr-item { display:flex; align-items:center; gap:9px; text-align:left; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-sm); padding:7px 10px; cursor:pointer; font-family:inherit; transition:border-color .15s, transform .12s, background .15s; }
.tr-item:hover { transform:translateX(2px); border-color:rgba(var(--accent-rgb),.4); }
.tr-item.warn { border-left:2px solid var(--warn); } .tr-item.crit { border-left:2px solid var(--crit); }
.tr-rank { font-family:var(--mono); font-size:9px; font-weight:700; color:var(--text-4); flex-shrink:0; width:16px; }
.tr-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.tr-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }

/* events feed */

.ev-body { flex:1; overflow-y:auto; padding:5px 0; min-height:0; }

.ev.sev-2 .e-msg { color:var(--warn); }

/* exec rollup */
.saved-hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:linear-gradient(110deg, rgba(var(--accent-rgb),.14), rgba(var(--accent-rgb),.04) 60%, transparent); border:1px solid rgba(var(--accent-rgb),.35); border-radius:var(--r-md); padding:15px 18px; margin-bottom:14px; }
.saved-hero .sh-left { min-width:220px; }
.saved-hero .sh-l { font-size:9px; font-weight:800; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; }
.saved-hero .sh-v { font-family:var(--mono); font-size:38px; font-weight:700; line-height:1.1; color:var(--accent-bright); letter-spacing:-1px; }
.saved-hero .sh-trend { font-size:9px; color:var(--text-3); letter-spacing:.04em; margin-top:2px; }
.saved-hero .sh-stats { display:flex; gap:26px; margin-left:auto; flex-wrap:wrap; }
.saved-hero .sh-stat { display:flex; flex-direction:column; gap:2px; }
.saved-hero .sh-stat .ss-v { font-family:var(--mono); font-size:21px; font-weight:700; color:var(--text-1); }
.saved-hero .sh-stat .ss-l { font-size:8px; font-weight:700; letter-spacing:.12em; color:var(--text-3); text-transform:uppercase; }
.fin-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.fin-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:10px 12px; border-left:2px solid var(--text-4); }
.fin-card.ok { border-left-color:var(--ok); } .fin-card.warn { border-left-color:var(--warn); } .fin-card.crit { border-left-color:var(--crit); }
.fin-card .fc-l { font-size:8px; font-weight:700; letter-spacing:.16em; color:var(--text-3); text-transform:uppercase; }
.fin-card .fc-v { font-family:var(--mono); font-size:20px; font-weight:700; color:var(--text-1); line-height:1.3; }
.fin-card.warn .fc-v { color:var(--warn); } .fin-card.crit .fc-v { color:var(--crit); }
.fin-card .fc-s { font-size:8px; color:var(--text-4); letter-spacing:.04em; margin-top:1px; }
.ec-risk { font-size:9px; color:var(--text-3); }
.ec-risk b { font-family:var(--mono); margin-left:3px; }
.exec-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.exec-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-md); padding:14px 16px; cursor:pointer; text-align:left; font-family:inherit; transition:border-color .15s; }
.exec-card:hover { border-color:var(--card-border2); }
.exec-card .ec-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:11px; }
.exec-card .ec-name { font-size:13px; font-weight:800; color:var(--text-1); letter-spacing:.02em; }
.exec-card .ec-sub { font-size:9px; color:var(--text-3); margin-top:3px; letter-spacing:.08em; text-transform:uppercase; }
.exec-card .ec-h { font-family:var(--mono); font-size:26px; font-weight:700; line-height:1; }
.exec-bar { height:6px; background:rgba(255,255,255,.05); border-radius:3px; overflow:hidden; }
.exec-bar > div { height:100%; border-radius:3px; transition:width .6s ease; }
.exec-stats { display:flex; gap:14px; margin-top:11px; font-size:10px; }
.exec-stats span { display:flex; align-items:center; gap:5px; color:var(--text-3); }
.exec-stats b { font-family:var(--mono); font-weight:700; }

.fade-in { animation:pageIn .3s cubic-bezier(.16,1,.3,1) both; }
@keyframes pageIn { from{transform:translateY(8px)} to{transform:none} }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }

/* faint grid texture behind everything */
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image: linear-gradient(rgba(var(--accent-rgb),.018) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent-rgb),.018) 1px, transparent 1px);
  background-size:46px 46px; }
body.no-grid::before { display:none; }
body.no-glow .tile.crit::after, body.no-glow .tile.warn::after { display:none !important; }
.shell { position:relative; z-index:1; }

/* ── Profile switcher dropdown ── */
.profile-dd { position:relative; }
.profile-dd-btn { display:flex; align-items:center; gap:8px; min-width:150px; padding:5px 10px 5px 11px; border-radius:6px; border:1px solid var(--card-border); background:transparent; color:var(--text-2); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-family:inherit; transition:color .15s, border-color .15s, background .15s; }
.profile-dd-btn:hover { color:var(--text-1); border-color:var(--text-3); }
.profile-dd-btn.open { color:var(--accent); border-color:var(--accent); background:rgba(var(--accent-rgb),.08); }
.profile-dd-btn .pdd-label { flex:1; text-align:left; }
.profile-dd-btn .pdd-caret { font-size:9px; color:var(--text-3); transition:transform .18s, color .15s; }
.profile-dd-btn.open .pdd-caret { transform:rotate(180deg); color:var(--accent); }
.pdd-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--accent); box-shadow:0 0 6px rgba(var(--accent-rgb),.6); }
.profile-dd-menu { position:absolute; top:34px; right:0; min-width:188px; z-index:600; display:flex; flex-direction:column; gap:2px; padding:5px; background:var(--card-bg); border:1px solid var(--card-border2); border-radius:var(--r-md); box-shadow:0 12px 34px rgba(0,0,0,.55); animation:ddIn .14s ease both; }
@keyframes ddIn { from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none} }
.profile-dd-item { display:flex; align-items:center; gap:9px; padding:8px 10px; border:none; border-radius:var(--r-sm); background:transparent; color:var(--text-2); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; font-family:inherit; text-align:left; transition:background .12s, color .12s; }
.profile-dd-item:hover { background:var(--card-bg2); color:var(--text-1); }
.profile-dd-item.on { color:var(--accent); }
.profile-dd-item .pdd-dot { opacity:.35; }
.profile-dd-item.on .pdd-dot { opacity:1; }
.profile-dd-item .pdd-check { margin-left:auto; color:var(--accent); font-size:10px; }

/* ── Profile-switch boot splash (reuses the NEPHES intro look) ── */
.fo-splash { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:var(--bg-body); animation:foSplashIn .16s ease both; }
.fo-splash.out { animation:foSplashOut .5s ease both; }
.fo-splash-logo { width:72px; height:72px; border-radius:14px; object-fit:cover; box-shadow:0 8px 32px rgba(var(--accent-rgb),.35); animation:foLogoIn .5s cubic-bezier(.16,1,.3,1) both; }
.fo-splash-word { text-align:center; animation:foWordIn .45s .15s cubic-bezier(.16,1,.3,1) both; }
.fo-splash-word .fw-name { font-size:32px; font-weight:900; letter-spacing:.28em; line-height:1; background:linear-gradient(90deg, var(--accent-bright), var(--accent) 55%, #b8900e); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.fo-splash-word .fw-sub { margin-top:7px; font-size:9px; font-weight:600; letter-spacing:.22em; color:var(--text-3); text-transform:uppercase; }
.fo-splash-bar { width:120px; height:2px; border-radius:1px; background:rgba(255,255,255,.06); overflow:hidden; opacity:0; animation:foBarShow .25s .22s ease forwards; }
.fo-splash-bar > i { display:block; height:100%; width:0; border-radius:1px; background:linear-gradient(90deg, #8a6a20, var(--accent), var(--accent-bright)); box-shadow:0 0 8px rgba(var(--accent-rgb),.5); animation:foBarFill 1.2s .3s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes foSplashIn { from{opacity:0} to{opacity:1} }
@keyframes foSplashOut { from{opacity:1; transform:scale(1)} to{opacity:0; transform:scale(1.04)} }
@keyframes foLogoIn { from{opacity:0; transform:scale(.82) translateY(12px)} to{opacity:1; transform:none} }
@keyframes foWordIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
@keyframes foBarShow { to{opacity:1} }
@keyframes foBarFill { to{width:100%} }
@media (prefers-reduced-motion: reduce) { .fo-splash, .fo-splash *, .profile-dd-menu { animation-duration:.01ms !important; } }

/* ── Documentation viewer modal + rendered markdown ── */
.doc-modal { width:780px; max-width:calc(100vw - 32px); max-height:min(84vh, calc(100vh - 32px)); display:flex; flex-direction:column; background:var(--card-bg); border:1px solid var(--card-border2); border-radius:var(--r-md); box-shadow:0 24px 70px rgba(0,0,0,.6); overflow:hidden; }
.doc-modal-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:18px 24px; }
.doc-modal-foot { flex:0 0 auto; padding:8px 16px; border-top:1px solid var(--card-border); font-family:var(--mono); font-size:9px; color:var(--text-4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.md-body { color:var(--text-2); font-size:13px; line-height:1.65; }
.md-body > *:first-child { margin-top:0; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { color:var(--text-1); line-height:1.25; margin:18px 0 8px; font-weight:800; }
.md-body h1 { font-size:20px; border-bottom:1px solid var(--card-border); padding-bottom:8px; }
.md-body h2 { font-size:16px; color:var(--accent); }
.md-body h3 { font-size:13px; letter-spacing:.02em; }
.md-body p { margin:8px 0; }
.md-body a { color:var(--accent); text-decoration:none; }
.md-body a:hover { text-decoration:underline; }
.md-body ul, .md-body ol { margin:8px 0 8px 22px; }
.md-body li { margin:3px 0; }
.md-body code { font-family:var(--mono); font-size:11px; background:var(--card-bg2); border:1px solid var(--card-border); border-radius:4px; padding:1px 5px; color:var(--accent-bright); }
.md-body pre { background:var(--card-bg2); border:1px solid var(--card-border); border-radius:var(--r-sm); padding:12px 14px; overflow-x:auto; margin:10px 0; }
.md-body pre code { background:none; border:none; padding:0; color:var(--text-2); font-size:11.5px; line-height:1.5; }
.md-body blockquote { border-left:2px solid var(--accent); margin:10px 0; padding:4px 14px; color:var(--text-3); }
.md-body table { border-collapse:collapse; margin:12px 0; font-size:12px; width:100%; }
.md-body th, .md-body td { border:1px solid var(--card-border); padding:6px 10px; text-align:left; }
.md-body th { background:var(--card-bg2); color:var(--text-1); font-weight:700; }
.md-body hr { border:none; border-top:1px solid var(--card-border); margin:16px 0; }
.md-body strong { color:var(--text-1); }
.md-body img { max-width:100%; }
.ek-badge{font-size:11px;padding:2px 7px;border-radius:var(--r-sm);background:var(--card-bg2);color:var(--text-2);border:1px solid var(--card-border)}
.ek-pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--card-bg2);color:var(--text-3)}
</style>
</head>
<body>
<div id="root"></div>

<!-- Dependency order: Industrial kit → console page → SensorArt plugin → Tweaks shell -->
<script type="text/babel" src="IndustrialKit.jsx"></script>
<script type="text/babel" src="Industrial.jsx"></script>
<script type="text/babel" src="SensorArt.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ek-panel.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": [
    "#C9A227",
    "#E9D072"
  ],
  "density": "comfortable",
  "view": "grid",
  "profile": "manufacturing",
  "live": true,
  "speed": "slow",
  "volatility": "calm",
  "gridTexture": false,
  "glow": true,
  "events": true
}/*EDITMODE-END*/;

const ACCENTS = [
  ["#E4BC49", "#FFD86A"],  // NFO Gold (brand)
  ["#C9A227", "#E9D072"],  // Brass
  ["#D8B75F", "#F0D9A0"],  // Champagne
  ["#E8A33D", "#FFC368"],  // Amber
];

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)].join(',');
}
function applyAccent(pair) {
  const [a, bright] = pair;
  const r = document.documentElement.style;
  r.setProperty('--accent', a);
  r.setProperty('--accent-bright', bright || a);
  r.setProperty('--accent-rgb', hexToRgb(a));
}

const SPEED_MAP = { slow: 0.5, normal: 1, fast: 2 };
const VOL_MAP = { calm: 0.5, normal: 1, active: 1.8 };

const PROFILE_OPTS = [
  { value: 'manufacturing', label: 'Manufacturing' },
  { value: 'enterprise', label: 'Enterprise' },
  { value: 'datasheets', label: 'Equipment Knowledge' }];


function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { applyAccent(t.accent); }, [t.accent]);
  const volatility = VOL_MAP[t.volatility] || 1;
  const stream = useFactoryStream({ live: t.live, speed: SPEED_MAP[t.speed] || 1, volatility });

  return (
    <React.Fragment>
      <Industrial stream={stream} density={t.density} defaultView={t.view} startProfile={t.profile}
        showEvents={t.events} gridTexture={t.gridTexture} glow={t.glow} volatility={volatility} />
      <TweaksPanel>
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={t.accent} options={ACCENTS} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density} options={['comfortable', 'compact']} onChange={(v) => setTweak('density', v)} />
        <TweakRadio label="Default view" value={t.view} options={['grid', 'tiles']} onChange={(v) => setTweak('view', v)} />
        <TweakSelect label="Start profile" value={t.profile} options={PROFILE_OPTS} onChange={(v) => setTweak('profile', v)} />
        <TweakSection label="Display" />
        <TweakToggle label="Background grid" value={t.gridTexture} onChange={(v) => setTweak('gridTexture', v)} />
        <TweakToggle label="Alert glow" value={t.glow} onChange={(v) => setTweak('glow', v)} />
        <TweakToggle label="Events ticker" value={t.events} onChange={(v) => setTweak('events', v)} />
        <TweakSection label="Live Data" />
        <TweakToggle label="Streaming" value={t.live} onChange={(v) => setTweak('live', v)} />
        <TweakRadio label="Speed" value={t.speed} options={['slow', 'normal', 'fast']} onChange={(v) => setTweak('speed', v)} />
        <TweakRadio label="Activity" value={t.volatility} options={['calm', 'normal', 'active']} onChange={(v) => setTweak('volatility', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
