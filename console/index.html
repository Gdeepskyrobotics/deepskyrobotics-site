<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEPHES Factory Observer — Console</title>

<link rel="stylesheet" href="console.css">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0d0d0b; }
  #root { height:100%; }
  /* Brand override — console.css ships an orange accent (#FF7A18); the console is
     embedded in the NFO-Gold marketing page, so keep the gold identity here. */
  :root {
    --accent:        #E4BC49;
    --accent-bright: #FFD86A;
    --accent-rgb:    228,188,73;
  }
  a { color: var(--accent); } a:hover { color: var(--accent-bright); }
</style>

<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Self-contained workspaces console bundle (exposes window.NFOConsoleApp) -->
<script type="text/babel" src="console-bundle-ws.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(NFOConsoleApp, { profile: 'manufacturing', speed: 'slow' })
  );
</script>
</body>
</html>
